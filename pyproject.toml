[project]
name = "util"
version = "0.1.0"
description = "Database utility library for us_equities upserts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "SQLAlchemy>=2.0",
    "pyodbc>=4.0",
    "pandas>=2.0",
    "pandera>=0.20",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["util"]
