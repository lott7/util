[project]
name = "util"
version = "0.1.0"
description = "Database utility library for us_equities upserts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "SQLAlchemy>=2.0",
    "pyodbc>=4.0",
    "pandas>=2.0",
    "pandera>=0.20",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["util"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
pretty = true
files = ["src", "tests"]
explicit_package_bases = true
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = ["pandas", "pandera.*", "pytest", "sqlalchemy.*"]
ignore_missing_imports = true
